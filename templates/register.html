<!DOCTYPE html>
<html>
<body style="font-family:sans-serif; text-align:center; background:#f4f4f4;">
    <h2>📝 Kayıt Ol</h2>
    <form action="{{ url_for('register') }}" method="POST" style="background:white; padding:20px; display:inline-block; border-radius:10px;">
        <input type="text" name="u" placeholder="Yeni Kullanıcı Adı" required style="margin:10px; padding:10px;"><br>
        <input type="password" name="p" placeholder="Yeni Şifre" required style="margin:10px; padding:10px;"><br>
        <button type="submit" style="padding:10px 20px; background:#3498db; color:white; border:none; border-radius:5px;">Kayıt Ol</button>
    </form>
    <p><a href="{{ url_for('login') }}">Geri Dön</a></p>
</body>
</html>
