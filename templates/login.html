<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap | Mis Gibi Mantar</title>
    <style>
        :root {
            --primary-color: #2ecc71;
            --secondary-color: #27ae60;
            --bg-color: #f4f7f6;
            --text-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-container {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h2 {
            color: var(--secondary-color);
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1rem;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #666;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box; /* Padding'in taşmasını engeller */
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 1rem;
        }

        button:hover {
            background-color: var(--secondary-color);
        }

        .links {
            margin-top: 1.5rem;
            font-size: 14px;
        }

        .links a {
            color: var(--secondary-color);
            text-decoration: none;
            margin: 0 10px;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .error {
            color: #e74c3c;
            background: #fdeaea;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 1rem;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="login-container">
    <h2>🍄 Mantar Teşhis Sistemi</h2>
    
    {% if hata %}
    <div class="error">{{ hata }}</div>
    {% endif %}

    <form action="{{ url_for('login') }}" method="POST">
        <div class="form-group">
            <label for="u">Kullanıcı Adı</label>
            <input type="text" id="u" name="u" placeholder="Kullanıcı adınızı girin" required>
        </div>
        
        <div class="form-group">
            <label for="p">Şifre</label>
            <input type="password" id="p" name="p" placeholder="Şifrenizi girin" required>
        </div>
        
        <button type="submit">Giriş Yap</button>
    </form>

    <div class="links">
        <a href="{{ url_for('register') }}">Hesap Oluştur</a>
        <a href="#">Şifremi Unuttum</a>
    </div>
</div>

</body>
</html>
