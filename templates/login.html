<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Giriş | Mis Gibi Mantar</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #2ecc71, #27ae60); height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); text-align: center; width: 350px; }
        .logos { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .logos img { height: 50px; object-fit: contain; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #2ecc71; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        a { font-size: 13px; color: #666; text-decoration: none; margin-top: 10px; display: inline-block; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logos">
            <img src="{{ url_for('static', filename='tubitak_logo.png') }}">
            <img src="{{ url_for('static', filename='okul_logo.png') }}">
        </div>
        <h2 style="color: #2c3e50; margin-bottom: 5px;">Mantar Teşhis</h2>
        <p style="font-size: 12px; color: #95a5a6; margin-bottom: 20px;">Konak Misak-ı Milli O.O. 8/A</p>
        <form action="{{ url_for('login') }}" method="POST">
            <input type="text" name="u" placeholder="Kullanıcı Adı" required>
            <input type="password" name="p" placeholder="Şifre" required>
            <button type="submit">Giriş Yap</button>
        </form>
        <div style="margin-top: 15px;">
            <a href="{{ url_for('register') }}">Hesap Oluştur</a> | <a href="#">Şifremi Unuttum</a>
        </div>
    </div>
</body>
</html>
