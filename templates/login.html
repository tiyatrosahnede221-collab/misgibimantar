<!DOCTYPE html>
<html>
<body style="font-family:sans-serif; text-align:center; background:#f4f4f4;">
    <h2>🍄 Giriş Yap</h2>
    <form action="{{ url_for('login') }}" method="POST" style="background:white; padding:20px; display:inline-block; border-radius:10px;">
        <input type="text" name="u" placeholder="Kullanıcı Adı" required style="margin:10px; padding:10px;"><br>
        <input type="password" name="p" placeholder="Şifre" required style="margin:10px; padding:10px;"><br>
        <button type="submit" style="padding:10px 20px; background:#2ecc71; color:white; border:none; border-radius:5px;">Giriş</button>
    </form>
    <p><a href="{{ url_for('register') }}">Hesap Oluştur</a></p>
</body>
</html>
