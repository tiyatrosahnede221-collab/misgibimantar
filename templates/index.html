<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Mantar Teşhis | Paneli</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f8f9fa; margin: 0; }
        .nav { background: white; padding: 15px; display: flex; justify-content: space-around; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .container { max-width: 600px; margin: 40px auto; background: white; padding: 30px; border-radius: 15px; text-align: center; }
        #drop-zone { border: 3px dashed #2ecc71; padding: 40px; border-radius: 15px; cursor: pointer; transition: 0.3s; background: #f0fff4; }
        #drop-zone:hover { background: #e2f9e9; }
        .result { margin-top: 20px; padding: 20px; border-radius: 10px; display: none; }
    </style>
</head>
<body>
    <div class="nav">
        <b>Hoş geldin, {{ user }}</b>
        <a href="{{ url_for('fotolarim') }}">📸 Geçmiş</a>
        <a href="{{ url_for('logout') }}" style="color:red">Çıkış</a>
    </div>

    <div class="container">
        <h2>🔬 Yeni Tarama Başlat</h2>
        <div id="drop-zone" onclick="document.getElementById('fileInput').click()">
            <p>Fotoğrafı buraya sürükleyin veya tıklayın</p>
            <input type="file" id="fileInput" hidden accept="image/*">
        </div>
        <div id="status" style="margin-top:10px; color:#666"></div>
        <div id="resultBox" class="result"></div>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('fileInput');
        let lat = "", lon = "";

        // Konum Al
        navigator.geolocation.getCurrentPosition(pos => {
            lat = pos.coords.latitude;
            lon = pos.coords.longitude;
        });

        fileInput.addEventListener('change', e => uploadFile(e.target.files[0]));

        function uploadFile(file) {
            if(!file) return;
            const formData = new FormData();
            formData.append('foto', file);
            formData.append('lat', lat);
            formData.append('lon', lon);

            document.getElementById('status').innerText = "Yapay Zeka Analiz Ediyor...";

            fetch('/tahmin', { method: 'POST', body: formData })
            .then(res => res.json())
            .then(data => {
                const box = document.getElementById('resultBox');
                box.style.display = 'block';
                box.style.background = data.sonuc.includes('Zehirli') ? '#fee2e2' : '#dcfce7';
                box.innerHTML = `<h3>Sonuç: ${data.sonuc}</h3><p>Doğruluk: %${data.yuzde}</p>`;
                document.getElementById('status').innerText = "Tamamlandı!";
            });
        }
    </script>
</body>
</html>
