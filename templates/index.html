<!DOCTYPE html>
<html>
<body style="font-family:sans-serif; text-align:center;">
    <nav style="background:#eee; padding:10px;">
        Hoş geldin <b>{{ user }}</b> | <a href="{{ url_for('fotolarim') }}">Geçmiş</a> | <a href="{{ url_for('logout') }}">Çıkış</a>
    </nav>
    <h2>🍄 Mantar Teşhisi</h2>
    <form action="{{ url_for('tahmin') }}" method="POST" enctype="multipart/form-data">
        <input type="file" name="foto" required><br><br>
        <button type="submit" style="padding:15px; background:#2ecc71; color:white; border:none; cursor:pointer;">Analiz Et</button>
    </form>
    {% if sonuc %}
        <div style="margin-top:20px; padding:20px; border:2px solid #2ecc71;">
            <h3>Sonuç: {{ sonuc }}</h3>
            <p>Doğruluk Oranı: %{{ yuzde }}</p>
        </div>
    {% endif %}
</body>
</html>
